<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<title>Secure Property Generator</title>

<style>
body {
  font-family: 'Segoe UI', sans-serif;
  background: #f5f6f8;
  margin: 0;
  padding: 20px;
}

/* HEADER TITLE */
.header {
  text-align: center;
  font-size: 24px;
  font-weight: bold;
  margin-bottom: 20px;
  color: #1976d2;
}

.container {
  max-width: 900px;
  margin: auto;
  background: #fff;
  border-radius: 8px;
  padding: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.tabs {
  display: flex;
  border-bottom: 2px solid #ddd;
  margin-bottom: 20px;
}

.tab {
  padding: 10px 20px;
  cursor: pointer;
  border: 1px solid #ddd;
  border-bottom: none;
  background: #f9f9f9;
}

.tab.active {
  background: #fff;
  font-weight: bold;
}

.row {
  display: flex;
  gap: 20px;
  margin-bottom: 15px;
}

.field {
  flex: 1;
  display: flex;
  flex-direction: column;
}

label {
  margin-bottom: 5px;
  font-size: 14px;
  color: #444;
}

input, select {
  padding: 8px;
  border: 1px solid #ccc;
  border-radius: 4px;
}

.checkbox {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 25px;
}

button {
  width: 100%;
  padding: 12px;
  background: #1976d2;
  color: white;
  border: none;
  border-radius: 5px;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  background: #125aa0;
}

.result {
  margin-top: 20px;
}

textarea {
  width: 100%;
  height: 120px;
  border: 1px solid #ccc;
  border-radius: 5px;
  padding: 10px;
}

/* FOOTER */
.footer {
  text-align: center;
  margin-top: 20px;
  font-size: 14px;
  color: #666;
}

.footer a {
  color: #1976d2;
  text-decoration: none;
  font-weight: bold;
}

.footer a:hover {
  text-decoration: underline;
}
</style>
</head>

<body>

<div class="header">Secure Properties Generator</div>

<div class="container">

  <div class="tabs">
    <div class="tab active">String</div>
  </div>

  <div class="row">
    <div class="field">
      <label>Operation</label>
      <select id="operation">
        <option>Encrypt</option>
        <option>Decrypt</option>
      </select>
    </div>

    <div class="field">
      <label>Algorithm</label>
      <select id="algorithm">
        <option>AES (default)</option>
        <option>Blowfish</option>
        <option>DES</option>
        <option>DESede</option>
        <option>RC2</option>
        <option>RCA</option>
      </select>
    </div>

    <div class="field">
      <label>State</label>
      <select id="mode">
        <option>CBC (default)</option>
        <option>CFB</option>
        <option>ECB</option>
        <option>OFB</option>
      </select>
    </div>

    <div class="checkbox">
      <input type="checkbox" id="iv" />
      <label for="iv">Use random IVs</label>
    </div>
  </div>

  <div class="row">
    <div class="field">
      <label>Key</label>
      <input type="text" id="key" placeholder="Enter key">
    </div>

    <div class="field">
      <label>Value</label>
      <input type="text" id="value" placeholder="Enter value">
    </div>
  </div>

  <button onclick="generate()">Generate</button>

  <div class="result">
    <label>Result</label>
    <textarea id="result"></textarea>
  </div>

</div>

<!-- FOOTER ADDED -->
<div class="footer">
  Created by <a href="https://github.com/Narsing-s" target="_blank">Narsing-s</a> GitHub
</div>

<script>
const enc=new TextEncoder(),dec=new TextDecoder(),MAX_BYTES=1024*1024,MIN_ITER=600000,MAX_ITER=1000000;
function b64(bytes){let s="";for(const x of bytes)s+=String.fromCharCode(x);return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function unb64(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";const bin=atob(s);return Uint8Array.from(bin,c=>c.charCodeAt(0))}
async function derive(pass,salt,iterations){const base=await crypto.subtle.importKey("raw",enc.encode(pass),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function generate(){
  const operation=document.getElementById("operation").value,key=document.getElementById("key").value,value=document.getElementById("value").value,algorithm=document.getElementById("algorithm").value,mode=document.getElementById("mode").value;
  if(!(window.crypto&&crypto.subtle&&window.isSecureContext)){alert("Web Crypto requires HTTPS or localhost.");return}
  if(!key||!value){alert("Please enter key and value");return}
  if(enc.encode(value).byteLength>MAX_BYTES){alert("Value is too large. Maximum size is 1 MiB.");return}
  if(operation==="Encrypt"){
    if(algorithm!=="AES (default)"||mode!=="CBC (default)"){alert("For secure browser encryption, this version supports AES-GCM only. The original legacy choices are retained in the UI for compatibility but are not implemented.");return}
    try{
      const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),iterations=600000,k=await derive(key,salt,iterations);
      const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv,tagLength:128},k,enc.encode(value)));
      const o={v:1,alg:"AES-256-GCM",kdf:"PBKDF2-SHA256",iterations,salt:b64(salt),iv:b64(iv),ciphertext:b64(ct)};
      document.getElementById("result").value="SPG1."+b64(enc.encode(JSON.stringify(o)));
    }catch(e){document.getElementById("result").value="Encryption failed"}
  }else{
    try{
      if(value.trim().length>2*1024*1024)throw new Error();
      const raw=value.trim().startsWith("SPG1.")?dec.decode(unb64(value.trim().slice(5))):value.trim(),o=JSON.parse(raw),iterations=Number(o.iterations),salt=unb64(o.salt),iv=unb64(o.iv),ct=unb64(o.ciphertext);
      if(o.v!==1||o.alg!=="AES-256-GCM"||o.kdf!=="PBKDF2-SHA256"||!Number.isInteger(iterations)||iterations<MIN_ITER||iterations>MAX_ITER||salt.length!==16||iv.length!==12||ct.length<16)throw new Error();
      const k=await derive(key,salt,iterations),plain=await crypto.subtle.decrypt({name:"AES-GCM",iv,tagLength:128},k,ct);
      document.getElementById("result").value=dec.decode(plain);
    }catch(e){document.getElementById("result").value="Invalid encrypted value"}
  }
}
</script>

</body>
</html>
