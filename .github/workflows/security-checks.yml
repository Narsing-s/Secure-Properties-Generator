name: Secure Properties Generator checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  crypto-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check browser JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, re.DOTALL)
          if len(scripts) != 1:
              raise SystemExit(f"Expected exactly one inline script, found {len(scripts)}")
          Path("/tmp/index-script.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/index-script.js

      - name: Run crypto tests
        run: node tests/crypto.test.js
